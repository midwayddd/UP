<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1200" viewBox="0 0 375 1200"><rect width="375" height="1200" fill="#102125"/><g font-family="Arial,sans-serif" fill="#e9e6d9"><text x="20" y="42" font-size="16">✳ АТЛАС СЕВЕРА</text><text x="330" y="42" font-size="22">☰</text><path d="M18 60H357" stroke="#52686a"/><text x="24" y="135" font-family="Georgia" font-size="43">Там, где</text><text x="24" y="185" font-family="Georgia" font-size="43" fill="#c59a5c">помнит земля</text><text x="24" y="225" font-size="15" fill="#a9c1c2">Истории между лесом, водой</text><text x="24" y="247" font-size="15" fill="#a9c1c2">и небом.</text><rect x="24" y="275" width="205" height="48" fill="#c59a5c"/><text x="40" y="305" font-size="13" fill="#102125">ИССЛЕДОВАТЬ ↗</text><circle cx="185" cy="440" r="105" fill="none" stroke="#c59a5c" stroke-width="2"/><circle cx="185" cy="440" r="82" fill="none" stroke="#a9c1c2" stroke-dasharray="3 7"/><circle cx="185" cy="440" r="52" fill="none" stroke="#c59a5c" stroke-width="3"/><path d="M185 385L201 424 240 440 201 456 185 495 169 456 130 440 169 424Z" fill="none" stroke="#c59a5c" stroke-width="2"/><path d="M18 580H357" stroke="#c59a5c" stroke-dasharray="3 7"/><text x="24" y="635" font-family="Georgia" font-size="32">Карта памяти</text><rect x="20" y="660" width="335" height="250" fill="#172e32" stroke="#52686a"/><path d="M35 820Q120 700 185 785T340 730 M45 700Q110 840 210 700T330 820" fill="none" stroke="#6d9293" stroke-width="2"/><g fill="#102125" stroke="#c59a5c" stroke-width="3"><circle cx="105" cy="790" r="17"/><circle cx="225" cy="745" r="17"/><circle cx="295" cy="835" r="17"/></g><rect x="20" y="930" width="335" height="205" fill="#172c30" stroke="#52686a"/><text x="42" y="970" font-size="12" fill="#c59a5c">ЛЕГЕНДА 01 · ВОДА</text><text x="42" y="1015" font-family="Georgia" font-size="25">Река, которая</text><text x="42" y="1045" font-family="Georgia" font-size="25">помнит</text><text x="42" y="1090" font-size="14" fill="#a9c1c2">История места и памяти</text><text x="42" y="1120" font-size="12" fill="#c59a5c">ЧИТАТЬ ЛЕГЕНДУ →</text><text x="24" y="1175" font-size="11" fill="#a9c1c2">КАРТА　 ЛЕГЕНДЫ　 О ПРОЕКТЕ</text></g></svg>