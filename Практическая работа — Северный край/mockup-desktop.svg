<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><rect width="1280" height="900" fill="#102125"/><g font-family="Arial,sans-serif" fill="#e9e6d9"><text x="70" y="48" font-size="20">✳ АТЛАС СЕВЕРНОЙ ТИШИНЫ</text><text x="850" y="48" font-size="14" fill="#c59a5c">КАРТА　 ЛЕГЕНДЫ　 О ПРОЕКТЕ</text><path d="M60 75H1220" stroke="#52686a"/><text x="70" y="170" font-family="Georgia" font-size="66">Там, где помнит</text><text x="70" y="242" font-family="Georgia" font-size="66" fill="#c59a5c">земля</text><text x="70" y="290" font-size="20" fill="#a9c1c2">Карта историй между лесом, водой и небом</text><rect x="70" y="330" width="220" height="54" fill="#c59a5c"/><text x="95" y="364" font-size="16" fill="#102125">ИССЛЕДОВАТЬ КАРТУ ↗</text><circle cx="1000" cy="230" r="145" fill="none" stroke="#c59a5c" stroke-width="2"/><circle cx="1000" cy="230" r="115" fill="none" stroke="#a9c1c2" stroke-dasharray="4 9"/><circle cx="1000" cy="230" r="75" fill="none" stroke="#c59a5c" stroke-width="4"/><path d="M1000 140L1025 205 1090 230 1025 255 1000 320 975 255 910 230 975 205Z" fill="none" stroke="#c59a5c" stroke-width="3"/><path d="M60 420H1220" stroke="#c59a5c" stroke-dasharray="3 8"/><text x="70" y="480" font-family="Georgia" font-size="42">Карта памяти</text><rect x="70" y="510" width="730" height="290" fill="#172e32" stroke="#52686a"/><path d="M100 720Q240 580 350 660T560 600T760 680 M130 550Q250 690 410 550T740 560" fill="none" stroke="#6d9293" stroke-width="3"/><g fill="#102125" stroke="#c59a5c" stroke-width="3"><circle cx="260" cy="675" r="22"/><circle cx="520" cy="610" r="22"/><circle cx="670" cy="710" r="22"/></g><rect x="830" y="510" width="380" height="290" fill="#172c30" stroke="#52686a"/><text x="870" y="570" font-size="14" fill="#c59a5c">ЛЕГЕНДА 01 · ВОДА</text><text x="870" y="630" font-family="Georgia" font-size="30">Река, которая</text><text x="870" y="670" font-family="Georgia" font-size="30">помнит</text><text x="870" y="725" font-size="17" fill="#a9c1c2">История места и памяти</text><text x="870" y="770" font-size="14" fill="#c59a5c">ЧИТАТЬ ЛЕГЕНДУ →</text><text x="70" y="855" font-size="14" fill="#a9c1c2">МИРЫ СЕВЕРА　　ГЛУБИНА ВОДЫ　　ШЁПОТ ЛЕСА　　ЗНАКИ НЕБА</text></g></svg>